name: A-Momentum Wave Shadow
on:
  workflow_dispatch:
  schedule:
    - cron: '11 4 8-10 10 *'
  push:
    branches: [main]
    paths:
      - 'scripts/wave_capture.py'
      - 'tests/test_wave_capture.py'
      - 'scripts/merch_proxy.py'
      - 'tests/test_merch_proxy.py'
      - 'scripts/sticker_proxy.py'
      - 'tests/test_sticker_proxy.py'
      - 'scripts/opportunity_union.py'
      - 'tests/test_opportunity_union.py'
      - 'scripts/wave_coupler.py'
      - 'tests/test_wave_coupler.py'
      - 'scripts/structural_triage.py'
      - 'tests/test_structural_triage.py'
      - 'scripts/semantic_resolver.py'
      - 'tests/test_semantic_resolver.py'
      - 'scripts/mechanism_decomposer.py'
      - 'tests/test_mechanism_decomposer.py'
      - 'scripts/security_scan.py'
      - 'spec/wave-capture.json'
      - 'spec/engine.json'
      - '.github/workflows/wave-shadow.yml'
permissions:
  contents: read
concurrency:
  group: a-momentum-wave-shadow
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Credential scan before shadow discovery
        run: python scripts/security_scan.py --repository
      - name: Install experimental proxy dependencies
        run: python -m pip install --disable-pip-version-check 'pytrends==4.9.2' 'pandas>=2.2,<3'
      - name: Validate multi-radar semantics locally
        run: |
          python scripts/wave_capture.py --self-test
          python scripts/merch_proxy.py --self-test
          python scripts/sticker_proxy.py --self-test
          python scripts/wave_coupler.py --raw /tmp/unused --merch /tmp/unused --out /tmp/unused --self-test
          python scripts/opportunity_union.py --dual /tmp/unused --sticker /tmp/unused --out /tmp/unused --self-test
          python scripts/structural_triage.py --self-test
          python scripts/semantic_resolver.py --self-test
          python scripts/mechanism_decomposer.py --self-test
          python -m unittest tests.test_wave_capture tests.test_merch_proxy tests.test_sticker_proxy tests.test_wave_coupler tests.test_opportunity_union tests.test_structural_triage tests.test_semantic_resolver tests.test_mechanism_decomposer
      - name: Push validation does not call external market providers
        if: github.event_name == 'push'
        run: echo A_MOMENTUM_WAVE_SHADOW_PUSH_VALIDATION_ONLY_NO_EXTERNAL_PROVIDER_CALLS
      - name: Limit scheduled M discovery to Oct 8-10 2026 only
        id: mcanary
        run: |
          utc_date="$(date -u +%F)"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [[ "$utc_date" > "2026-10-07" ]] && [[ "$utc_date" < "2026-10-11" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "A_MOMENTUM_M_CANARY_WINDOW_ACTIVE $utc_date"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "A_MOMENTUM_M_CANARY_WINDOW_CLOSED $utc_date"
          fi
      - name: Capture one bounded M-only Rising snapshot
        if: github.event_name == 'schedule' && steps.mcanary.outputs.run == 'true'
        run: |
          python scripts/merch_proxy.py --geo US --timeframe 'now 7-d' --seeds 'shirt|shirts|t shirt' --limit 25 --build-retries 1 --between-seed-seconds 2 --rate-limit-cooldown-seconds 8 --out /tmp/a-momentum-m-only-raw.json
      - name: Classify M-only snapshot using existing offline transforms
        if: github.event_name == 'schedule' && steps.mcanary.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json,sys,os
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import wave_coupler,structural_triage,mechanism_decomposer
          raw=json.loads(Path('/tmp/a-momentum-m-only-raw.json').read_text())
          frozen=json.loads(Path('acceptance/s-wave-cross-snapshot-proof-20261001.json').read_text())
          old={x['opportunity_core'] for x in frozen['mechanism_hypothesis_persistence']['exact_same_hypotheses']}
          # No R or S was requested: this is NOT negative market evidence.
          doc=wave_coupler.build({'candidates':[],'capture_state':'NOT_REQUESTED_M_ONLY'},raw)
          wave_coupler.validate_output(doc)
          structural_triage.apply(doc)
          structural_triage.validate(doc)
          mechanism_decomposer.apply(doc)
          mechanism_decomposer.validate(doc)
          intake={x['opportunity_id']:x for x in doc['opportunity_intake']}
          leads=[]
          for x in doc['mechanism_decomposition_decisions']:
              if x['decomposition_state']!='SHADOW_MECHANISM_HYPOTHESIS':
                  continue
              item=intake[x['opportunity_id']]
              leads.append({
                'opportunity_core':item['merch_core'],
                'mechanism_candidate_id':x['mechanism_hypothesis']['mechanism_candidate_id'],
                'mechanism_family':x['mechanism_hypothesis']['mechanism_family'],
                'query_variants':item['query_variants'],
                'seed_evidence':item['seed_evidence'],
                'new_vs_two_frozen_persistent_hypotheses':item['merch_core'] not in old,
                'sticker_demand_proven':False,
                'buyer_jtbd_proven':False,
                'commercial_pass':False,
                'safety_pass':False
              })
          out={
            'schema':'A_MOMENTUM_BOUNDED_M_ONLY_DISCOVERY',
            'schema_version':'1.0',
            'run_id':int(os.environ['GITHUB_RUN_ID']),
            'head_sha':os.environ['GITHUB_SHA'],
            'mode':'SHADOW_ONLY_NO_PRODUCTION_AUTHORITY',
            'provider_status':raw['provider_status'],
            'transport_health_state':raw['transport_health_state'],
            'raw_M_source_evidence':raw,
            'R_state':'NOT_REQUESTED',
            'S_state':'NOT_REQUESTED',
            'M_unique_cores':doc['unique_merch_core_count'],
            'structural_summary':doc['structural_triage']['summary'],
            'mechanism_hypothesis_count':len(leads),
            'mechanism_hypotheses':leads,
            'new_vs_two_frozen_hypotheses_count':sum(x['new_vs_two_frozen_persistent_hypotheses'] for x in leads),
            'commercial_qualified_count':0,
            'fresh_commerce_evidence_proven':False,
            'production_watchlist_mutation':False,
            'runtime_latest_mutation':False,
            'daily7_authority':False,
            'trademark_or_IP_authority':False,
            'credentials_used':False,
            'source_query_not_anchor':True,
            'cross_pull_velocity_claim':False,
            'canary_end_date_utc':'2026-10-10'
          }
          assert raw['credentials_used'] is False and raw['provider_failure_is_zero_demand'] is False
          assert len(leads)==doc['mechanism_decomposition']['hypothesis_count']
          assert all(not x['commercial_pass'] and not x['safety_pass'] for x in leads)
          assert out['R_state']==out['S_state']=='NOT_REQUESTED'
          assert not out['production_watchlist_mutation'] and not out['runtime_latest_mutation']
          Path('/tmp/a-momentum-m-only-canary.json').write_text(json.dumps(out,indent=2)+'\n')
          print('A_MOMENTUM_M_CANARY_PROVIDER_STATUS',out['provider_status'])
          print('A_MOMENTUM_M_CANARY_MECHANISM_HYPOTHESES',len(leads))
          print('A_MOMENTUM_M_CANARY_NEW_VS_OLD',out['new_vs_two_frozen_hypotheses_count'])
          print('A_MOMENTUM_M_CANARY_COMMERCIAL_PASS_NOT_CLAIMED')
          PY
      - name: Upload M-only evidence (no production publication)
        if: github.event_name == 'schedule' && steps.mcanary.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a-momentum-bounded-m-discovery
          path: /tmp/a-momentum-m-only-canary.json
          if-no-files-found: error
          retention-days: 14
      - name: Capture Google Trends raw market waves
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/wave_capture.py --geo US --limit 50 --out /tmp/a-momentum-raw-wave-shadow.json
      - name: Capture merch-proxy Rising waves
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/merch_proxy.py --geo US --timeframe 'now 7-d' --seeds 'shirt|shirts|t shirt' --limit 25 --build-retries 2 --between-seed-seconds 6 --rate-limit-cooldown-seconds 30 --out /tmp/a-momentum-merch-proxy-shadow.json
      - name: Pause between independent proxy radars
        if: github.event_name == 'workflow_dispatch'
        run: sleep 30
      - name: Capture sticker-native S-wave Rising signals
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/sticker_proxy.py --geo US --timeframe 'now 7-d' --seeds 'sticker|stickers|vinyl sticker' --limit 25 --build-retries 2 --between-seed-seconds 6 --rate-limit-cooldown-seconds 30 --out /tmp/a-momentum-sticker-proxy-shadow.json
      - name: Couple raw and merch-proxy waves
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/wave_coupler.py --raw /tmp/a-momentum-raw-wave-shadow.json --merch /tmp/a-momentum-merch-proxy-shadow.json --out /tmp/a-momentum-dual-wave-shadow.json
      - name: Union independent M and S opportunities
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/opportunity_union.py --dual /tmp/a-momentum-dual-wave-shadow.json --sticker /tmp/a-momentum-sticker-proxy-shadow.json --out /tmp/a-momentum-multi-radar-shadow.json
      - name: Structural triage M-or-S opportunity union
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/structural_triage.py --input /tmp/a-momentum-multi-radar-shadow.json --out /tmp/a-momentum-multi-radar-shadow.json
      - name: Resolve semantic HOLDs with provenance-only metadata
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/semantic_resolver.py --input /tmp/a-momentum-multi-radar-shadow.json --out /tmp/a-momentum-multi-radar-shadow.json
      - name: Build mechanism hypotheses from review-allowed evidence
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/mechanism_decomposer.py --input /tmp/a-momentum-multi-radar-shadow.json --out /tmp/a-momentum-multi-radar-shadow.json
      - name: Enforce shadow-only boundary
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/a-momentum-multi-radar-shadow.json'))
          assert x['mode']=='SHADOW_ONLY_NO_PRODUCTION_AUTHORITY'
          assert x['credentials_used'] is False
          assert x['runtime_latest_mutation'] is False
          assert x['production_watchlist_mutation'] is False
          assert x['anchor_assignment_automatic'] is False
          assert x['commercial_eligibility_automatic'] is False
          assert x['mechanism_decomposition_automatic'] is False
          assert x['bridge_query_materialization_automatic'] is False
          assert x['magnitude_comparison_across_independent_trends_requests_forbidden'] is True
          assert x['raw_wave_capture']['candidate_count']>0
          assert x['merch_proxy_capture']['provider_failure_is_zero_demand'] is False
          assert x['merch_proxy_capture']['cross_seed_score_comparison_forbidden'] is True
          assert x['merch_proxy_capture']['provider_gap_is_no_rising_queries'] is False
          assert x['merch_proxy_capture']['partial_success_preserved'] is True
          assert x['merch_proxy_capture']['transport_health_state'] in {'RECOVERED_WITH_DATA','PARTIAL_WITH_DATA','THROTTLED','PASS_NO_RISING_DATA','PARTIAL_NO_RISING_DATA','OTHER_SENSOR_GAP'}
          assert x['merch_proxy_capture']['usable_merch_evidence'] is (x['merch_proxy_capture']['merch_wave_count']>0)
          assert x['merch_proxy_capture']['bridge_experiment_input_ready'] is (x['merch_proxy_capture']['transport_health_state'] in {'RECOVERED_WITH_DATA','PARTIAL_WITH_DATA'})
          assert x['merch_proxy_capture']['bridge_experiment_input_readiness_role']=='TRANSPORT_AND_EVIDENCE_AVAILABILITY_ONLY_NOT_COMMERCIAL_ELIGIBILITY'
          mt=x['merch_proxy_capture']['transport']
          assert mt['strategy']=='BATCH_PAYLOAD_SHARED_COOKIE_PER_WIDGET_PARTIAL_PRESERVATION'
          assert mt['batched_seed_payload'] is True
          assert mt['shared_client_context'] is True
          assert mt['per_widget_partial_preservation'] is True
          assert mt['immediate_seed_retry_on_429'] is False
          assert mt['rate_limit_circuit_breaker'] is True
          sx=x['sticker_proxy_capture']
          assert sx['schema']=='A_MOMENTUM_STICKER_PROXY_SHADOW'
          assert sx['radar']=='S_STICKER_NATIVE'
          assert sx['radar_role']=='INDEPENDENT_STICKER_NATIVE_DISCOVERY_NOT_M_CONFIRMATION'
          assert sx['commercial_eligibility_authority'] is False
          assert sx['m_confirmation_authority'] is False
          assert sx['provider_failure_is_zero_demand'] is False
          assert sx['provider_gap_is_no_rising_queries'] is False
          assert x['unique_merch_core_count'] <= x['merch_observation_count']
          assert x['unique_sticker_core_count'] <= x['sticker_observation_count']
          assert x['opportunity_intake_count']==x['opportunity_union_summary']['TOTAL_UNIQUE']
          assert x['opportunity_union_policy']=='EXACT_NORMALIZED_CORE_DEDUPE_M_OR_S_NO_INTERSECTION_GATE'
          assert x['discovery_model']['independent_opportunity_lanes']==['MERCH_PROXY_WAVE','STICKER_NATIVE_WAVE']
          assert x['discovery_model']['opportunity_union']=='M_OR_S'
          assert x['discovery_model']['cross_radar_confirmation_required'] is False
          assert x['discovery_model']['temporal_observation_mode']=='PARALLEL_NON_BLOCKING'
          assert x['commercial_bridge_active'] is False
          assert x['sticker_radar_is_m_confirmation'] is False
          assert all(c['source_lane'] in {'M_ONLY','S_ONLY','M_S_MULTI_RADAR'} for c in x['opportunity_intake'])
          assert all(c['intake_state']=='DISCOVERY_INTAKE_READY_UNSCREENED' for c in x['opportunity_intake'])
          assert all(c['requires_cross_radar_confirmation'] is False for c in x['opportunity_intake'])
          assert all(c['structural_triage_required'] is True for c in x['opportunity_intake'])
          assert x['structural_triage']['authority']=='SHADOW_STRUCTURE_ONLY'
          assert x['structural_triage']['decision_count']==x['opportunity_intake_count']
          assert x['structural_triage']['semantic_entity_resolution_performed'] is False
          assert x['structural_triage']['commercial_eligibility_authority'] is False
          assert x['structural_triage']['ip_safety_authority'] is False
          assert x['structural_triage']['mechanism_generation_authority'] is False
          assert all(c['mechanism_decomposition_automatic'] is False for c in x['structural_triage_decisions'])
          assert all(c['commercial_eligibility_decision'] is None for c in x['structural_triage_decisions'])
          assert all(c['ip_safety_decision'] is None for c in x['structural_triage_decisions'])
          assert all(c['production_eligible'] is False for c in x['structural_triage_decisions'])
          assert x['semantic_resolution']['authority']=='EXACT_METADATA_RESOLUTION_ONLY'
          assert x['semantic_resolution']['provider']=='WIKIDATA'
          assert x['semantic_resolution']['provider_role']=='METADATA_ONLY_NOT_MARKET_SIGNAL'
          assert x['semantic_resolution']['exact_match_required'] is True
          assert x['semantic_resolution']['ambiguous_or_missing_canonical_match_remains_hold'] is True
          assert x['semantic_resolution']['canonicalization_policy']=='UNIQUE_PRIMARY_LABEL_OR_UNIQUE_ENWIKI_SITELINK_AMONG_EXACT_MATCHES'
          assert x['semantic_resolution']['provider_throttling_is_gap_not_semantic_absence'] is True
          assert x['semantic_resolution']['market_signal_authority'] is False
          assert x['semantic_resolution']['commercial_eligibility_authority'] is False
          assert x['semantic_resolution']['ip_safety_authority'] is False
          assert x['semantic_resolution']['mechanism_generation_authority'] is False
          assert all(c['market_signal_authority'] is False for c in x['semantic_resolution_decisions'])
          assert all(c['commercial_eligibility_authority'] is False for c in x['semantic_resolution_decisions'])
          assert all(c['ip_safety_authority'] is False for c in x['semantic_resolution_decisions'])
          assert all(c['mechanism_decomposition_automatic'] is False for c in x['semantic_resolution_decisions'])
          assert all(c['production_eligible'] is False for c in x['semantic_resolution_decisions'])
          assert x['mechanism_decomposition']['authority']=='SHADOW_ABSTRACTION_ONLY'
          eligible_ids={
              c['opportunity_id'] for c in x['structural_triage_decisions']
              if c['mechanism_decomposition_allowed'] is True
          } | {
              c['opportunity_id'] for c in x['semantic_resolution_decisions']
              if c['mechanism_review_allowed'] is True
          }
          assert x['mechanism_decomposition']['review_allowed_input_count']==len(eligible_ids)
          assert x['mechanism_decomposition']['decision_count']==len(x['mechanism_decomposition_decisions'])==len(eligible_ids)
          assert {c['opportunity_id'] for c in x['mechanism_decomposition_decisions']}==eligible_ids
          assert x['mechanism_decomposition']['source_wording_or_iconography_reuse_forbidden'] is True
          assert x['mechanism_decomposition']['commercial_eligibility_authority'] is False
          assert x['mechanism_decomposition']['ip_safety_authority'] is False
          assert x['mechanism_decomposition']['mechanism_production_authority'] is False
          assert x['mechanism_decomposition']['idea_generation_authority'] is False
          assert x['mechanism_decomposition']['bridge_query_authority'] is False
          assert x['mechanism_decomposition']['anchor_assignment_authority'] is False
          assert x['mechanism_decomposition']['watchlist_promotion_authority'] is False
          assert x['mechanism_decomposition']['daily7_selection_authority'] is False
          assert all(c['production_eligible'] is False for c in x['mechanism_decomposition_decisions'])
          for c in x['mechanism_decomposition_decisions']:
              if c['decomposition_state']=='SHADOW_MECHANISM_HYPOTHESIS':
                  assert c['mechanism_hypothesis']['source_specific_wording_or_iconography_reuse_allowed'] is False
                  assert c['mechanism_hypothesis']['abstraction_level']=='MECHANISM_FAMILY_ONLY_NOT_PRODUCT_CREATIVE'
                  assert c['idea_generation_performed'] is False
                  assert c['bridge_query_materialized'] is False
                  assert c['anchor_query_assigned'] is False
                  assert c['watchlist_promotion_allowed'] is False
          assert x['merch_grouping_policy']=='NORMALIZED_QUERY_WITH_MERCH_FORMAT_TOKENS_REMOVED_PRESERVE_SEED_EVIDENCE'
          assert all(c['match_policy'] in {'EXACT_NORMALIZED_CORE_ONLY_PARTIAL_OVERLAP_IS_UNRESOLVED','UNMATCHED_UNIQUE_MERCH_CORE'} for c in x['couplings'])
          assert all(c['bridge_queries']==[] for c in x['couplings'])
          assert all(c['anchor_query'] is None for c in x['couplings'])
          assert all(c['mechanism_key'] is None for c in x['couplings'])
          print('A_MOMENTUM_MULTI_RADAR_SHADOW_BOUNDARY_PASS',x['coupling_summary'])
          PY
      - name: Upload live Wave Shadow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: a-momentum-wave-shadow
          path: /tmp/a-momentum-multi-radar-shadow.json
          if-no-files-found: error
          retention-days: 14
