name: Build Momentum Receipt
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'spec/**'
      - 'scripts/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build receipt
        run: python scripts/build_receipt.py --out momentum-receipt.json
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: a-momentum-receipt
          path: momentum-receipt.json
          if-no-files-found: error
