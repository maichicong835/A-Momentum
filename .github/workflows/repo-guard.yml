          assert pp['push_may_upload_workflow_artifact'] is True
          assert pp['push_may_publish_runtime_latest'] is False
          assert pp['schedule_may_publish_runtime_latest'] is True
          assert pp['workflow_dispatch_may_publish_runtime_latest'] is True
