          assert all(z['cadence_hours']<=op['evidence_freshness_threshold_hours'] for z in w['entries'] if z['cadence_class']=='WARM')
          assert w['policy']['measurement_identity_required'] is True and w['policy']['query_family_first_is_anchor'] is True
          assert w['policy']['fallback_query_may_not_redefine_anchor'] is True and w['policy']['shared_proxy_evidence_is_not_independent'] is True
