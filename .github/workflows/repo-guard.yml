          assert sr['provider_throttling_is_gap_not_semantic_absence'] is True
          assert sr['market_signal_authority'] is False
          assert sr['commercial_eligibility_authority'] is False
          assert sr['ip_safety_authority'] is False
          assert sr['automatic_mechanism_decomposition'] is False
          st=wc['dual_wave_shadow']['structural_triage']
          assert st['status']=='SHADOW_ONLY_NON_AUTHORITATIVE'
          assert st['semantic_entity_resolution'] is False
          assert st['named_entity_or_property_clearance'] is False
          assert st['commercial_eligibility_authority'] is False
          assert st['ip_safety_authority'] is False
          assert st['automatic_mechanism_decomposition'] is False
          dm=wc['dual_wave_shadow']['discovery_model']
          assert dm['primary_opportunity_lane']=='MERCH_PROXY_WAVE'
          assert dm['r_coupling_required_for_m_intake'] is False
          assert dm['fixed_wait_before_m_intake_hours']==0
          assert dm['temporal_observation_mode']=='PARALLEL_NON_BLOCKING'
          assert dm['structural_triage_required_before_mechanism_decomposition'] is True
          assert dm['automatic_mechanism_decomposition'] is False
