name: Repository Guard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan tracked repository for credential material
        run: python scripts/security_scan.py --repository
      - name: Validate v0.2.0 authority and public-runtime boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('CURRENT.json').read_text()); e=json.loads(Path('spec/engine.json').read_text())
          w=json.loads(Path('runtime/watchlist.json').read_text()); p=json.loads(Path('runtime/quality-pool.json').read_text()); b=json.loads(Path('runtime/bootstrap-observations.json').read_text())
          ds=[json.loads(Path(x).read_text()) for x in ['examples/demo-observations.json','examples/demo-quality-pool.json','examples/demo-watchlist.json']]
          assert c['engine_version']==e['engine_version']==w['engine_version']==p['engine_version']==b['engine_version']=='0.2.0'
          assert all(x['engine_version']=='0.2.0' for x in ds)
          assert c['status'] in {'CUTOVER_CANDIDATE','CURRENT'}
          if c['status']=='CUTOVER_CANDIDATE':
              assert c['cutover_state']=='RUNTIME_REHEARSAL_REQUIRED' and c['production_acceptance'] is None
          else:
              assert c['cutover_state']=='PRODUCTION_READY' and c['production_acceptance']
          r=c['roles']; assert r['public_runtime_execution'] and r['public_runtime_outputs'] and r['runtime_business_data_storage']
          assert r['credential_storage'] is False and r['credentials_actions_secrets_only'] is True
          assert not r['daily7_final_selection'] and not r['trademark_clearance'] and not r['source_acquisition'] and not r['drive_mutation']
          rb=e['runtime_data_boundary']; assert rb['public_repository_mode']=='PUBLIC_RUNTIME_WITH_SECRET_ISOLATION'
          assert rb['current_google_trends_sensor_requires_credentials'] is False and rb['secret_values_may_not_be_logged_artifacted_cached_or_committed'] is True
          x=e['runtime_execution']; assert x['owner_repository']=='maichicong835/A-Momentum' and x['schedule_hot_hours']==4
          assert x['schedule_warm_hours']==8
          assert x['google_trends']['active'] and not x['google_trends']['credential_required']
          qf=x['google_trends']['query_family_fallback']
          assert qf['enabled'] is True and qf['maximum_distinct_variants_per_entity']==3
          assert qf['retries_per_query']==2 and qf['base_backoff_seconds']==3
          assert qf['entity_gap_only_after_all_selected_query_variants_fail'] is True
          assert x['google_trends']['aggregation']=='NON_OVERLAPPING_COMPLETED_24H_MEAN' and x['google_trends']['minimum_blocks']==3
          assert x['google_trends']['cross_pull_normalization_arithmetic_forbidden'] is True
          assert x['other_declared_surfaces_are_not_active_collectors_until_machine_proven'] is True and x['runtime_failure_may_not_block_daily7'] is True
          tr=x['trigger_roles']; pp=x['publication_policy']
          assert tr['schedule']=='PRODUCTION_PUBLISHER'
          assert tr['workflow_dispatch']=='OPERATOR_PRODUCTION_OR_RECOVERY_PUBLISHER'
          assert tr['push']=='VALIDATION_ONLY_NO_RUNTIME_LATEST_PUBLISH'
          assert pp['runtime_latest_is_consumer_discovery_pointer'] is True
          assert pp['push_may_execute_sensor_and_contract_validation'] is True
          assert pp['push_may_upload_workflow_artifact'] is True
          assert pp['push_may_publish_runtime_latest'] is False
          assert pp['schedule_may_publish_runtime_latest'] is True
          assert pp['workflow_dispatch_may_publish_runtime_latest'] is True
          op=e['observation_pipeline']
          assert op['continuity_bootstrap_path']=='runtime/continuity-bootstrap-google-trends.json'
          assert op['last_good_observation_survives_not_due'] is True
          assert op['sensor_gap_preserves_last_good_without_advancing_freshness'] is True
          assert op['success_replaces_only_same_mechanism_last_good'] is True
          assert op['receipt_generated_at_is_not_evidence_freshness'] is True
          assert op['per_entity_last_successful_observed_at_required'] is True
          assert op['per_entity_latest_attempt_state_required'] is True
          assert op['evidence_freshness_threshold_hours']==8
          assert op['warm_cadence_may_not_exceed_evidence_freshness_threshold'] is True
          assert x['schedule_warm_hours']<=op['evidence_freshness_threshold_hours']
          assert w['policy']['warm_cadence_hours']<=op['evidence_freshness_threshold_hours']
          assert all(z['cadence_hours']<=op['evidence_freshness_threshold_hours'] for z in w['entries'] if z['cadence_class']=='WARM')
          assert e['anti_drift']['query_family_first_query_failure_may_not_define_entity_gap'] is True
          assert e['anti_drift']['freshness_may_not_be_improved_by_relabeling_stale_last_good_as_fresh'] is True
          seed=json.loads(Path(op['continuity_bootstrap_path']).read_text())
          assert seed['schema']=='A_MOMENTUM_CONTINUITY_BOOTSTRAP'
          assert seed['engine_version']=='0.2.0'
          assert seed['observation_count']==len(seed['observations'])==14
          assert seed['no_inference'] is True
          assert seed['sensor_gap_is_not_zero_demand'] is True
          assert e['anti_drift']['temporal_route_requires_fresh_entity_evidence_not_fresh_packaging_only'] is True
          assert e['anti_drift']['sensor_gap_may_not_erase_last_good_signal'] is True
          runtime_workflow_text=Path('.github/workflows/runtime.yml').read_text()
          assert "name: Publish production runtime snapshot (schedule/manual only)" in runtime_workflow_text
          assert "if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'" in runtime_workflow_text
          assert "Publish latest sanitized runtime snapshot" not in runtime_workflow_text
          assert "--continuity-seed runtime/continuity-bootstrap-google-trends.json" in runtime_workflow_text
          assert "--previous runtime/latest/google-trends-observations.json" in runtime_workflow_text
          assert "--evidence-fresh-hours 8" in runtime_workflow_text
          assert "--max-query-variants 3" in runtime_workflow_text
          assert "--retries-per-query 2" in runtime_workflow_text
          assert "--sleep-seconds 3" in runtime_workflow_text
          assert w['count']==len(w['entries'])==15 and p['count']==len(p['entries'])==15 and p['minimum_pool_target']==14
          assert all(z['launch_authorization'] is False for z in p['entries']) and len(b['observations'])==10
          assert e['anti_drift']['daily7_must_freeze_provider_output_commit_and_receipt_sha256_per_run'] is True
          assert e['anti_drift']['mutable_latest_is_discovery_pointer_not_run_authority'] is True
          sa=c['schedule_autonomy']
          assert sa['production_cron']=='17 */4 * * *'
          runtime_workflow=Path('.github/workflows/runtime.yml').read_text()
          assert "cron: '17 */4 * * *'" in runtime_workflow
          if sa['schedule_event_machine_proven']:
              assert sa['state']=='MACHINE_PROVEN_WITH_PROVIDER_DELAY'
              assert sa['dispatch_punctuality']=='NON_DETERMINISTIC_OBSERVED_DELAY'
              assert sa['exact_nominal_slot_binding_available'] is False
              closure=Path(sa['closure_receipt'])
              assert closure.is_file()
              z=json.loads(closure.read_text())
              assert z['schema']=='A_MOMENTUM_SCHEDULE_AUTONOMY_CLOSURE'
              assert z['engine_version']=='0.2.0'
              assert z['schedule_event_machine_proven'] is True
              assert z['production_cron']=='17 */4 * * *'
              assert z['historical_diagnostic_preserved'] is True
              assert len(z['schedule_runs'])>=2
              assert all(x['event']=='schedule' and x['conclusion']=='success' for x in z['schedule_runs'])
              assert z['latest_scheduled_snapshot']['credentials_used'] is False
              assert z['latest_scheduled_snapshot']['fallback_pool_status']=='PASS'
              assert z['daily7_effect']['provider_failure_blocks_daily7'] is False
              assert z['daily7_effect']['stale_or_unavailable_fallback']=='F5_DIRECT_DAILY7_DISCOVERY'
              print('A_MOMENTUM_SCHEDULE_AUTONOMY_CLOSURE_PASS')
          print('A_MOMENTUM_V020_AUTHORITY_PASS')
          PY
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build synthetic receipt
        run: |
          python scripts/build_receipt.py --engine-commit-sha TEST --out /tmp/synthetic.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/synthetic.json')); assert x['engine_version']=='0.2.0' and x['engine_commit_sha']=='TEST' and x['fallback_pool_status']['status']=='PASS'
          print('A_MOMENTUM_SYNTHETIC_RECEIPT_PASS')
          PY
      - name: Build production bootstrap receipt without network
        run: |
          python scripts/build_receipt.py --observations runtime/bootstrap-observations.json --observations-glob '/tmp/no/*.json' --pool runtime/quality-pool.json --engine-commit-sha "$GITHUB_SHA" --out /tmp/runtime.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/runtime.json')); assert x['engine_version']=='0.2.0' and x['fallback_pool_status']['count']==15 and x['fallback_pool_status']['status']=='PASS'
          print('A_MOMENTUM_RUNTIME_BOOTSTRAP_PASS')
          PY
      - name: Validate latest public runtime snapshot when present
        run: |
          if [ ! -f runtime/latest/index.json ]; then echo A_MOMENTUM_LATEST_RUNTIME_NOT_YET_PUBLISHED; exit 0; fi
          python scripts/security_scan.py --runtime-output runtime/latest
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          i=json.loads(Path('runtime/latest/index.json').read_text()); r=json.loads(Path('runtime/latest/receipt.json').read_text()); s=json.loads(Path('runtime/latest/sensor-status.json').read_text())
          assert i['engine_version']==r['engine_version']==s['engine_version']=='0.2.0'
          assert i['receipt_sha256']==hashlib.sha256(Path('runtime/latest/receipt.json').read_bytes()).hexdigest()
          assert r['engine_commit_sha']==i['provider_engine_commit_sha'] and i['credentials_used'] is False and s['credentials_used'] is False
          assert s['provider_failure_is_zero_demand'] is False
          print('A_MOMENTUM_LATEST_RUNTIME_SNAPSHOT_PASS',i['sensor_result'])
          PY
