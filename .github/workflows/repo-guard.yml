          assert wc['query_semantics']['BRIDGE_QUERY']['generation_requires']=='EXPLICIT_COMMERCIAL_BRIDGE_ELIGIBILITY'
          assert wc['promotion_policy']['raw_wave_capture_precedes_commercial_bridge'] is True
          assert wc['promotion_policy']['raw_wave_default_commercial_bridge_eligible'] is False
          assert wc['promotion_policy']['bridge_queries_empty_until_eligibility_pass'] is True
          assert wc['anti_drift']['raw_wave_may_not_auto_materialize_merch_queries'] is True
          assert wc['anti_drift']['raw_and_merch_proxy_wave_are_independent_evidence_tracks'] is True
          assert wc['anti_drift']['merch_proxy_failure_may_not_fail_raw_wave_capture'] is True
          assert wc['anti_drift']['independent_google_trends_requests_may_not_be_compared_by_absolute_0_100_magnitude'] is True
          assert wc['anti_drift']['coupled_wave_is_not_commercial_eligibility'] is True
