name: Repository Guard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan tracked repository for credential material
        run: python scripts/security_scan.py --repository
      - name: Validate v0.2.0 authority and public-runtime boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('CURRENT.json').read_text()); e=json.loads(Path('spec/engine.json').read_text())
          w=json.loads(Path('runtime/watchlist.json').read_text()); p=json.loads(Path('runtime/quality-pool.json').read_text()); b=json.loads(Path('runtime/bootstrap-observations.json').read_text())
          ds=[json.loads(Path(x).read_text()) for x in ['examples/demo-observations.json','examples/demo-quality-pool.json','examples/demo-watchlist.json']]
          assert c['engine_version']==e['engine_version']==w['engine_version']==p['engine_version']==b['engine_version']=='0.2.0'
          assert all(x['engine_version']=='0.2.0' for x in ds)
          assert c['status'] in {'CUTOVER_CANDIDATE','CURRENT'}
          if c['status']=='CUTOVER_CANDIDATE':
              assert c['cutover_state']=='RUNTIME_REHEARSAL_REQUIRED' and c['production_acceptance'] is None
          else:
              assert c['cutover_state']=='PRODUCTION_READY' and c['production_acceptance']
          r=c['roles']; assert r['public_runtime_execution'] and r['public_runtime_outputs'] and r['runtime_business_data_storage']
          assert r['credential_storage'] is False and r['credentials_actions_secrets_only'] is True
          assert not r['daily7_final_selection'] and not r['trademark_clearance'] and not r['source_acquisition'] and not r['drive_mutation']
          rb=e['runtime_data_boundary']; assert rb['public_repository_mode']=='PUBLIC_RUNTIME_WITH_SECRET_ISOLATION'
          assert rb['current_google_trends_sensor_requires_credentials'] is False and rb['secret_values_may_not_be_logged_artifacted_cached_or_committed'] is True
          x=e['runtime_execution']; assert x['owner_repository']=='maichicong835/A-Momentum' and x['schedule_hot_hours']==4
          assert x['schedule_warm_hours']==8
          assert x['google_trends']['active'] and not x['google_trends']['credential_required']
          qf=x['google_trends']['query_family_fallback']
          assert qf['enabled'] is True and qf['maximum_distinct_variants_per_entity']==3
          assert qf['retries_per_query']==2 and qf['base_backoff_seconds']==3
          assert qf['entity_gap_only_after_all_selected_query_variants_fail'] is True
          assert x['google_trends']['aggregation']=='NON_OVERLAPPING_COMPLETED_24H_MEAN' and x['google_trends']['minimum_blocks']==3
          assert x['google_trends']['cross_pull_normalization_arithmetic_forbidden'] is True
          assert x['other_declared_surfaces_are_not_active_collectors_until_machine_proven'] is True and x['runtime_failure_may_not_block_daily7'] is True
          tr=x['trigger_roles']; pp=x['publication_policy']
          assert tr['schedule']=='PRODUCTION_PUBLISHER'
          assert tr['workflow_dispatch']=='OPERATOR_PRODUCTION_OR_RECOVERY_PUBLISHER'
          assert tr['push']=='VALIDATION_ONLY_NO_RUNTIME_LATEST_PUBLISH'
          assert pp['runtime_latest_is_consumer_discovery_pointer'] is True
          assert pp['push_may_execute_sensor_and_contract_validation'] is True
          assert pp['push_may_upload_workflow_artifact'] is True
          assert pp['push_may_publish_runtime_latest'] is False
          assert pp['schedule_may_publish_runtime_latest'] is True
          assert pp['workflow_dispatch_may_publish_runtime_latest'] is True
          op=e['observation_pipeline']
          assert op['continuity_bootstrap_path']=='runtime/continuity-bootstrap-google-trends.json'
          assert op['last_good_observation_survives_not_due'] is True
          assert op['sensor_gap_preserves_last_good_without_advancing_freshness'] is True
          assert op['success_replaces_only_same_mechanism_last_good'] is True
          assert op['receipt_generated_at_is_not_evidence_freshness'] is True
          assert op['per_entity_last_successful_observed_at_required'] is True
          assert op['per_entity_latest_attempt_state_required'] is True
          assert op['evidence_freshness_threshold_hours']==8
          assert op['warm_cadence_may_not_exceed_evidence_freshness_threshold'] is True
          assert x['schedule_warm_hours']<=op['evidence_freshness_threshold_hours']
          assert w['policy']['warm_cadence_hours']<=op['evidence_freshness_threshold_hours']
          assert all(z['cadence_hours']<=op['evidence_freshness_threshold_hours'] for z in w['entries'] if z['cadence_class']=='WARM')
          assert e['anti_drift']['query_family_first_query_failure_may_not_define_entity_gap'] is True
          assert e['anti_drift']['freshness_may_not_be_improved_by_relabeling_stale_last_good_as_fresh'] is True
          assert e['anti_drift']['wave_capture_shadow_may_not_mutate_production_watchlist'] is True
          assert e['anti_drift']['wave_capture_shadow_may_not_publish_runtime_latest'] is True
          assert e['anti_drift']['discovery_bridge_anchor_query_roles_must_remain_distinct'] is True
          assert e['anti_drift']['bridge_or_support_query_may_not_redefine_anchor_longitudinal_series'] is True
          assert e['anti_drift']['raw_wave_may_not_auto_materialize_merch_queries'] is True
          assert e['anti_drift']['raw_and_merch_proxy_wave_are_independent_evidence_tracks'] is True
          assert e['anti_drift']['merch_proxy_failure_may_not_fail_raw_wave_capture'] is True
          assert e['anti_drift']['independent_google_trends_requests_may_not_be_compared_by_absolute_0_100_magnitude'] is True
          assert e['anti_drift']['coupled_wave_is_not_commercial_eligibility'] is True
          assert e['anti_drift']['cross_seed_duplicate_related_queries_must_not_inflate_merch_wave_count'] is True
          assert e['anti_drift']['named_entity_or_partial_phrase_overlap_may_not_claim_coupled_wave'] is True
          assert e['anti_drift']['m_wave_may_enter_discovery_without_r_coupling'] is True
