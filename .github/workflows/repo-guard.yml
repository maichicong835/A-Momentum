              anchors.setdefault(mz['anchor_proxy_id'],[]).append((z['mechanism_key'],mz['anchor_query']))
          shared=[rows for rows in anchors.values() if len(rows)>1]
          assert len(shared)==2 and all(len({q for _,q in rows})==1 for rows in shared)
