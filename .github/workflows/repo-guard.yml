          assert e['anti_drift']['structural_triage_pass_is_not_commercial_eligibility'] is True
          assert e['anti_drift']['structural_triage_pass_is_not_ip_safety_clearance'] is True
          assert e['anti_drift']['ambiguous_structure_must_default_to_hold'] is True
          assert e['anti_drift']['product_configuration_demand_may_not_be_relabelled_expression_demand'] is True
          assert e['anti_drift']['semantic_metadata_provider_may_not_become_market_signal'] is True
          assert e['anti_drift']['semantic_resolution_requires_exact_label_or_alias_match'] is True
          assert e['anti_drift']['multiple_exact_semantic_matches_require_unique_canonical_evidence_or_remain_ambiguous'] is True
          assert e['anti_drift']['semantic_provider_throttling_must_be_gap_not_semantic_absence'] is True
